<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Páginas do PDF</title>
<!-- Ferramenta de teste: com dev/servidor-teste.ps1 rodando, abra
     http://localhost:8765/dev/visualizar-pdf.html?f=arquivo.pdf&p=prefixo
     Cada página do PDF (lido de /__out/) é salva como PNG na pasta de saída do servidor. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head><body><pre id="log">carregando…</pre>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const f = q.get('f'), prefix = q.get('p') || 'pg', scale = +(q.get('s') || 1.1);
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument('/__out/' + f).promise;
  const out = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const vp = page.getViewport({ scale });
    const c = document.createElement('canvas');
    c.width = vp.width; c.height = vp.height;
    // intent 'print' evita requestAnimationFrame, que trava quando a aba está oculta.
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp, intent: 'print' }).promise;
    const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
    const name = `${prefix}-${String(i).padStart(2, '0')}.png`;
    await fetch('/__save?name=' + name, { method: 'POST', body: blob });
    out.push(name);
  }
  document.getElementById('log').textContent = 'OK ' + pdf.numPages + '\n' + out.join('\n');
})().catch((e) => { document.getElementById('log').textContent = 'ERRO ' + e; });
</script></body></html>
